<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 2000 1000" width="2000" height="1000" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #13134A; }
  .zone { fill: #F7F4FF; stroke: #E6E0FA; stroke-width: 2; }
  .zone-h { font-size: 20px; font-weight: 700; letter-spacing: 3px; fill: #7B4DFF; }
  .card { fill: #FFFFFF; stroke: #E6E0FA; stroke-width: 2; }
  .card-t { font-size: 25px; font-weight: 700; }
  .card-b { font-size: 18px; fill: #4A4A7A; }
  .dark { fill: #13134A; stroke: none; }
  .dark-t { font-size: 25px; font-weight: 700; fill: #FFFFFF; }
  .dark-b { font-size: 18px; fill: #D8D2F5; }
  .lbl { font-size: 17px; font-weight: 600; fill: #7B4DFF; }
  .flow { stroke: #7B4DFF; stroke-width: 3; fill: none; }
  .flow-grey { stroke: #8A86B8; stroke-width: 3; fill: none; }
  .pill { fill: #F2EDFF; stroke: #E6E0FA; stroke-width: 2; }
  .pill-t { font-size: 21px; font-weight: 700; }
  .pill-b { font-size: 17px; fill: #4A4A7A; }
  .tick { font-size: 18px; fill: #4A4A7A; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7B4DFF"/>
  </marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8A86B8"/>
  </marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#13134A" flood-opacity="0.08"/>
  </filter>
</defs>

<!-- ============ ZONES ============ -->
<rect class="zone" x="60" y="40" width="440" height="850" rx="28"/>
<text class="zone-h" x="100" y="90">OWNER'S BROWSER</text>

<rect class="zone" x="560" y="40" width="900" height="850" rx="28"/>
<text class="zone-h" x="600" y="90">AHEADLY ON STREAMLIT CLOUD · MEMORY ONLY</text>

<rect class="zone" x="1520" y="40" width="420" height="850" rx="28"/>
<text class="zone-h" x="1560" y="90">GOOGLE GEMINI · EXTERNAL</text>

<!-- ============ ZONE A: OWNER ============ -->
<g filter="url(#sh)">
  <rect class="card" x="100" y="140" width="360" height="110" rx="18"/>
  <text class="card-t" x="124" y="184">Bank statement</text>
  <text class="card-b" x="124" y="216">CSV or Excel, as the bank exports it</text>

  <rect class="card" x="100" y="270" width="360" height="110" rx="18"/>
  <text class="card-t" x="124" y="314">Upcoming payments</text>
  <text class="card-b" x="124" y="346">Optional · Date, Description, Amount</text>

  <rect class="card" x="100" y="640" width="360" height="150" rx="18"/>
  <text class="card-t" x="124" y="684">What the owner sees</text>
  <text class="card-b" x="124" y="716">Dashboard · Alerts · Ask · What-if</text>
  <text class="card-b" x="124" y="744">Screens only: the browser keeps</text>
  <text class="card-b" x="124" y="770">no copy of the data</text>
</g>

<!-- upload arrow -->
<path class="flow" d="M460,260 L530,260 L530,230 L600,230" marker-end="url(#ar)"/>
<text class="lbl" x="470" y="296">upload</text>

<!-- screens arrow back to the owner -->
<path class="flow-grey" d="M600,715 L460,715" marker-end="url(#arg)"/>

<!-- ============ ZONE B: SERVER ============ -->
<g filter="url(#sh)">
  <!-- File connector -->
  <rect class="card" x="600" y="170" width="300" height="120" rx="18"/>
  <text class="card-t" x="624" y="212">File connector</text>
  <text class="card-b" x="624" y="242">Reads bank headers (EN / ES),</text>
  <text class="card-b" x="624" y="268">day-first dates, 1.250,00, balance</text>

  <!-- Repository -->
  <rect class="card" x="600" y="340" width="300" height="260" rx="18" stroke="#7B4DFF" stroke-width="3"/>
  <text class="card-t" x="624" y="384">Repository</text>
  <text class="card-b" x="624" y="414">SQLite held in memory</text>
  <text class="card-b" x="624" y="448">Transactions, upcoming payments,</text>
  <text class="card-b" x="624" y="474">forecasts, alerts</text>
  <text class="card-b" x="624" y="512" font-weight="700" fill="#13134A">One database per browser tab.</text>
  <text class="card-b" x="624" y="538">Never written to disk, never</text>
  <text class="card-b" x="624" y="564">shared with another visitor.</text>

  <!-- Streamlit UI -->
  <rect class="card" x="600" y="660" width="300" height="130" rx="18"/>
  <text class="card-t" x="624" y="702">Streamlit UI</text>
  <text class="card-b" x="624" y="732">Six pages. Asks App Core for</text>
  <text class="card-b" x="624" y="758">everything it shows; runs no SQL</text>

  <!-- Forecast engine -->
  <rect class="card" x="990" y="170" width="430" height="120" rx="18"/>
  <text class="card-t" x="1014" y="212">Forecast Engine · Prophet</text>
  <text class="card-b" x="1014" y="242">Daily net flow in, 500 paths out:</text>
  <text class="card-b" x="1014" y="268">worst, base and best case</text>

  <!-- Insight translator -->
  <rect class="card" x="990" y="330" width="430" height="150" rx="18"/>
  <text class="card-t" x="1014" y="372">Insight Translator</text>
  <text class="card-b" x="1014" y="402">6 tools pull numbers from App Core,</text>
  <text class="card-b" x="1014" y="428">Gemini turns them into words,</text>
  <text class="card-b" x="1014" y="454">a guardrail checks every figure</text>

  <!-- App Core -->
  <rect class="card" x="990" y="520" width="430" height="120" rx="18"/>
  <text class="card-t" x="1014" y="562">App Core</text>
  <text class="card-b" x="1014" y="592">Alerts, daily check, scenarios, plans.</text>
  <text class="card-b" x="1014" y="618">Every number is computed here</text>
</g>

<!-- connector -> repository -->
<path class="flow" d="M750,290 L750,340" marker-end="url(#ar)"/>
<text class="lbl" x="766" y="322">rows</text>

<!-- bus from repository to the three engines -->
<path class="flow" d="M900,470 L940,470 L940,230 L990,230" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path class="flow" d="M940,405 L990,405" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path class="flow" d="M940,470 L940,580 L990,580" marker-end="url(#ar)" marker-start="url(#ar)"/>

<!-- App Core -> UI -->
<path class="flow-grey" d="M1205,640 L1205,668 L960,668 L960,725 L900,725" marker-end="url(#arg)"/>
<text class="lbl" x="972" y="712" fill="#8A86B8">screens</text>

<!-- lifetime note -->
<text class="tick" x="600" y="836">Lifetime of the data: while the tab is open · wiped by "Start over" · gone when the app restarts</text>

<!-- ============ ZONE C: GEMINI ============ -->
<g filter="url(#sh)">
  <rect class="card" x="1560" y="140" width="340" height="110" rx="18"/>
  <text class="card-t" x="1584" y="182">API key</text>
  <text class="card-b" x="1584" y="212">Streamlit Cloud secrets only.</text>
  <text class="card-b" x="1584" y="236">Not in the code, not on GitHub.</text>

  <rect class="dark" x="1560" y="330" width="340" height="150" rx="18"/>
  <text class="dark-t" x="1584" y="372">Gemini API</text>
  <text class="dark-b" x="1584" y="402">gemini-3.5-flash-lite</text>
  <text class="dark-b" x="1584" y="428">Writes the alert text and the</text>
  <text class="dark-b" x="1584" y="454">chat answers. Stores nothing of ours.</text>

  <rect class="card" x="1560" y="520" width="340" height="270" rx="18" stroke="#EF4F5F" stroke-width="3"/>
  <text class="card-t" x="1584" y="564">Never leaves the server</text>
  <text class="card-b" x="1584" y="602">✕  The uploaded files</text>
  <text class="card-b" x="1584" y="634">✕  The full transaction history</text>
  <text class="card-b" x="1584" y="682" font-weight="700" fill="#13134A">Sent with each question</text>
  <text class="card-b" x="1584" y="714">✓  Business name and today's date</text>
  <text class="card-b" x="1584" y="746">✓  Totals, weekly forecast, payment</text>
  <text class="card-b" x="1584" y="772">     labels, at most 50 transaction lines</text>
</g>

<!-- translator <-> gemini -->
<path class="flow" d="M1420,385 L1560,385" marker-end="url(#ar)"/>
<text class="lbl" x="1438" y="370">numbers out</text>
<path class="flow-grey" d="M1560,425 L1420,425" marker-end="url(#arg)"/>
<text class="lbl" x="1446" y="456" fill="#8A86B8">words back</text>

<!-- ============ BOTTOM STRIP ============ -->
<g>
  <rect class="pill" x="60" y="915" width="600" height="70" rx="35"/>
  <text class="pill-t" x="100" y="946">0 bytes on disk</text>
  <text class="pill-b" x="100" y="970">the data lives in memory for one session only</text>

  <rect class="pill" x="700" y="915" width="600" height="70" rx="35"/>
  <text class="pill-t" x="740" y="946">1 database per visitor</text>
  <text class="pill-b" x="740" y="970">nobody can see or change anyone else's numbers</text>

  <rect class="pill" x="1340" y="915" width="600" height="70" rx="35"/>
  <text class="pill-t" x="1380" y="946">Summaries reach Gemini, files never do</text>
  <text class="pill-b" x="1380" y="970">and every number it writes is checked against ours</text>
</g>
</svg>
